[project]
name = "vexora"
version = "5.8.1"
description = "VEXORA — local-first Windows desktop AI assistant"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["legacy_tests", "app/ui/main_window.py"]  # UI file is dense legacy code; refactor separately

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "S102", "S307", "S602", "S605"]  # syntax errors, pyflakes, bugbear, no eval/exec/shell=True
ignore = ["UP006", "UP007", "UP035", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
